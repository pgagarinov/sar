[project]
name = "sar-integration"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = []
description = "Integration hub for Supervised Agentic Research (SAR) — deploy, test, and manage the multi-repo system"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/sar_integration"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
sar-integration = { path = ".", editable = true }
sar-harness-core = { path = "../sar-harness-core", editable = true }

[tool.pixi.tasks]
# Own .claude/ files: dot-claude-<action>
dot-claude-list = "PYTHONPATH=src python -m sar_integration.dot_claude_cli list"
dot-claude-read = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli read", depends-on = [] }
dot-claude-edit = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli edit", depends-on = [] }
dot-claude-diff = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli diff", depends-on = [] }
dot-claude-delete = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli delete", depends-on = [] }
# Supervisor's .claude/ files: supervisor-dot-claude-<action>
supervisor-dot-claude-list = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo supervisor list"
supervisor-dot-claude-read = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo supervisor read", depends-on = [] }
supervisor-dot-claude-edit = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo supervisor edit", depends-on = [] }
supervisor-dot-claude-diff = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo supervisor diff", depends-on = [] }
supervisor-dot-claude-delete = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo supervisor delete", depends-on = [] }
# Researcher's .claude/ files: researcher-dot-claude-<action>
researcher-dot-claude-list = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo researcher list"
researcher-dot-claude-read = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo researcher read", depends-on = [] }
researcher-dot-claude-edit = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo researcher edit", depends-on = [] }
researcher-dot-claude-diff = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo researcher diff", depends-on = [] }
researcher-dot-claude-delete = { cmd = "PYTHONPATH=src python -m sar_integration.dot_claude_cli --repo researcher delete", depends-on = [] }

[tool.pixi.environments]
dev = { features = ["dev"], solve-group = "default" }

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-timeout>=2,<3"]

[tool.pixi.feature.dev.tasks]
test = "PYTHONPATH=src python -m pytest tests/ -v"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
timeout = 30
markers = ["e2e: end-to-end tests"]

[tool.pixi.dependencies]
python = "3.14.*"
