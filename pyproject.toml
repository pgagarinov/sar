[project]
name = "sar-integration"
version = "0.1.0"
requires-python = "==3.14.*"
dependencies = []
description = "Integration hub for Supervised Agentic Research (SAR) — deploy, test, and manage the multi-repo system"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/sar_integration"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
sar-integration = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.14.*"
